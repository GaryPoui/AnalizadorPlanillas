services:
  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-5}
      - PRICEBOT_API_KEY=${PRICEBOT_API_KEY:-}
      - PRICEBOT_ALLOWED_ORIGINS=${PRICEBOT_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      - SAVE_HISTORY=${SAVE_HISTORY:-0}
      - HYBRID_EXTRACTION=${HYBRID_EXTRACTION:-1}
      - PRICEBOT_AUTH_REQUIRED=${PRICEBOT_AUTH_REQUIRED:-1}
      - PRICEBOT_SESSION_SECRET=${PRICEBOT_SESSION_SECRET:-}
      - PRICEBOT_USERS=${PRICEBOT_USERS:-}
      - PRICEBOT_COOKIE_SECURE=${PRICEBOT_COOKIE_SECURE:-0}
      - PRICEBOT_REQUIRE_HTTPS=${PRICEBOT_REQUIRE_HTTPS:-0}
      - PRICEBOT_ENABLE_API_DOCS=${PRICEBOT_ENABLE_API_DOCS:-0}
      - PRICEBOT_ALLOW_EXTERNAL_AI=${PRICEBOT_ALLOW_EXTERNAL_AI:-0}
      - PRICEBOT_LOG_FILENAMES=${PRICEBOT_LOG_FILENAMES:-0}
      - TRANSFORM_CACHE_MAX_ITEMS=${TRANSFORM_CACHE_MAX_ITEMS:-0}
      - PRICEBOT_MAX_UPLOAD_MB=${PRICEBOT_MAX_UPLOAD_MB:-50}
      - PRICEBOT_MAX_BATCH_FILES=${PRICEBOT_MAX_BATCH_FILES:-10}
      - PRICEBOT_MAX_BATCH_MB=${PRICEBOT_MAX_BATCH_MB:-100}
      - PRICEBOT_MAX_ARCHIVE_UNCOMPRESSED_MB=${PRICEBOT_MAX_ARCHIVE_UNCOMPRESSED_MB:-200}
      - PRICEBOT_MAX_PDF_PAGES=${PRICEBOT_MAX_PDF_PAGES:-300}
      - PRICEBOT_PUBLIC_URL=${PRICEBOT_PUBLIC_URL:-http://127.0.0.1:3000}
      - PRICEBOT_CONFIRMATION_TTL_SEC=${PRICEBOT_CONFIRMATION_TTL_SEC:-86400}
      - PRICEBOT_SMTP_HOST=${PRICEBOT_SMTP_HOST:-}
      - PRICEBOT_SMTP_PORT=${PRICEBOT_SMTP_PORT:-587}
      - PRICEBOT_SMTP_USERNAME=${PRICEBOT_SMTP_USERNAME:-}
      - PRICEBOT_SMTP_PASSWORD=${PRICEBOT_SMTP_PASSWORD:-}
      - PRICEBOT_SMTP_FROM=${PRICEBOT_SMTP_FROM:-}
      - PRICEBOT_SMTP_STARTTLS=${PRICEBOT_SMTP_STARTTLS:-1}
      - PRICEBOT_SMTP_SSL=${PRICEBOT_SMTP_SSL:-0}
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - api
